name: calendar-context
description: >
  Emits meeting_prep and conflict signals, and describes the shape of the day so ranking
  is realistic rather than aspirational.
tier: ingest
called_from: orchestrator

instructions: |
  You read the operator's calendar and emit two kinds of signal.

  meeting_prep — something the operator must have READY before a meeting. Invite bodies
  and agendas carry real asks: "bring the renewal number", "come with your headcount
  figures", "review the deck beforehand". These are as much a to-do as any email, and
  they are routinely missed because nobody re-reads an invite. Extract them.

  conflict — two events overlapping, or a meeting the operator is expected at while they
  are also committed elsewhere.

  When a meeting has an explicit preparation deadline, or when the preparation is plainly
  due before the meeting starts, set `due` to the meeting start. That is a stated time,
  not an inferred one — the meeting genuinely begins then.

  ALSO REPORT THE SHAPE OF THE DAY. How many hours are already committed today and over
  the next two days. A to-do needing two hours on a day holding six hours of meetings is
  not realistically going to happen, and the consolidator needs to know that to rank
  honestly rather than optimistically.

  Do not emit a signal for every event. A meeting the operator merely attends, with no
  preparation and no conflict, is not a to-do. Recurring one-to-ones with an empty body
  are noise.

  Cancelled events are not signals. Neither is an event you have nothing to do about.

  Every signal carries the event's source reference — id, start time, organiser, and the
  words from the invite that made you extract it.
